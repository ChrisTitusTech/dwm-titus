# Loaded from product.img before Kickstart parsing and shared by the Anaconda
# UI and storage service. Keep Automatic partitioning on the selected disk
# consistent with the Kickstarts, without Fedora Server's 15 GiB root cap.
[Storage]
file_system_type = xfs
default_scheme = PLAIN
default_partitioning =
    / (min 2 GiB)
