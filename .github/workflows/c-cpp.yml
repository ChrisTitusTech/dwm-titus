name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: fedora:44
    env:
      DWM_TEST_TMP_ROOT: /var/tmp/dwm-titus-tests

    steps:
      - name: Install checkout dependency
        run: dnf install -y --setopt=install_weak_deps=False git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build and validation dependencies
        run: |
          source scripts/dwm-utils.sh
          source scripts/dwm-packages.sh
          mapfile -t required_packages < <(dwm_packages fedora required | awk 'NF' | sort -u)
          mapfile -t qml_packages < <(dwm_packages fedora qml-validation | awk 'NF' | sort -u)
          dnf install -y --setopt=install_weak_deps=False \
            "${required_packages[@]}" "${qml_packages[@]}" \
            diffutils dbus-daemon \
            pkgconf-pkg-config ShellCheck shfmt pykickstart \
            xorg-x11-server-Xvfb

      - name: Validate Fedora package map
        run: scripts/run-tests make check-fedora-packages

      - name: Validate
        run: scripts/run-tests

      - name: Validate privileged display helper security
        env:
          DWM_SECURITY_CONTAINER: "1"
        run: scripts/run-tests tests/test-settings-display-security.sh

      - name: Validate nested X11 runtime
        run: scripts/run-tests make check-xvfb-runtime

  clang-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44

    steps:
      - name: Install checkout dependency
        run: dnf install -y --setopt=install_weak_deps=False git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Clang and build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            clang make pkgconf-pkg-config \
            libX11-devel libXft-devel libXinerama-devel libXrender-devel \
            imlib2-devel libxcb-devel xcb-util-devel \
            fontconfig-devel freetype-devel

      - name: Build with Clang
        run: make clean all CC=clang

  quickshell-qml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44

    steps:
      - name: Install checkout dependency
        run: dnf install -y --setopt=install_weak_deps=False git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Quickshell QML lint dependencies
        run: dnf install -y --setopt=install_weak_deps=False make quickshell qt6-qtdeclarative-devel

      - name: Validate Quickshell package version
        run: scripts/run-tests scripts/dwm-quickshell-version-check

      - name: Validate Quickshell QML
        run: scripts/run-tests make check-quickshell-qml
