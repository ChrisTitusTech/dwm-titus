name: Build and Deploy Astro Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install, build, and upload Astro site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6
        with:
          path: ./docs
          node-version: 24

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'ChrisTitusTech/dwm-titus'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
